# ── إعدادات Netlify ───────────────────────────────────────────────────────────
# المشروع موقع ثابت بالكامل (HTML/CSS/JS) — ما في باك إند ولا خطوة بناء.
# قاعدة البيانات والتوثيق على Firebase، والمتصفح بيتصل فيهم مباشرة.

[build]
  # مجلد الموقع — هون index.html
  publish = "public"
  # ما في شي ينبنى. الأمر موجود بس ليتغلّب على أي أمر قديم محفوظ بإعدادات الموقع.
  command = "echo static-site-no-build"

[build.environment]
  NODE_VERSION = "20"

# أي رابط بيرجّع الصفحة الرئيسية (تطبيق صفحة واحدة)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
