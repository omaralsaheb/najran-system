# ── إعدادات Netlify ───────────────────────────────────────────────────────────
# المشروع صار موقع ثابت بالكامل (HTML/CSS/JS) — ما في باك إند ولا خطوة بناء.
# قاعدة البيانات والتوثيق على Firebase، والمتصفح بيتصل فيهم مباشرة.

[build]
  # مجلد الموقع — هون index.html
  publish = "public"
  # ما في شي ينبنى؛ الأمر موجود بس لأن Netlify بيحتفظ بأمر قديم بإعداداته
  command = "echo 'موقع ثابت — ما في خطوة بناء'"

# أي رابط بيرجّع الصفحة الرئيسية (تطبيق صفحة واحدة)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
