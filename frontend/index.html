<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Najran Agency — نظام إدارة الوكالة</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg: #0A0A0A;
    --surface: #161616;
    --surface-2: #1F1F1F;
    --border: #2E2E2E;
    --text: #F5F4EF;
    --text-dim: #93918A;
    --accent: #F0B429;
    --accent-soft: #FBD98A;
    --accent-dim: #3A2E10;
    --glow: rgba(240,180,41,.35);
    --danger: #D96C5A;
    --ok: #6FBF8B;
    --radius: 14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Tajawal', sans-serif; min-height:100vh; }
  .mono{ font-family:'IBM Plex Mono', monospace; direction:ltr; display:inline-block; }

  /* ============ LANDING ============ */
  #landing-screen{ position:fixed; inset:0; z-index:50; background: radial-gradient(ellipse 60% 45% at 50% 38%, rgba(240,180,41,.10), transparent 70%), var(--bg); overflow:hidden; }
  .particle{ position:absolute; width:3px; height:3px; border-radius:50%; background:var(--accent); opacity:.5; pointer-events:none; }
  @media (prefers-reduced-motion: no-preference){ .particle{ animation: drift linear infinite; } }
  @keyframes drift{ 0%{ transform:translateY(0) translateX(0); opacity:0; } 10%{ opacity:.6; } 90%{ opacity:.4; } 100%{ transform:translateY(-90vh) translateX(20px); opacity:0; } }
  .scene{ position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; perspective:1400px; }
  .stage{ position:relative; width:420px; height:420px; transform-style:preserve-3d; display:flex; align-items:center; justify-content:center; }
  .floor{ position:absolute; width:900px; height:900px; top:54%; left:50%; margin-left:-450px; margin-top:-100px; background-image: linear-gradient(rgba(240,180,41,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(240,180,41,.14) 1px, transparent 1px); background-size:44px 44px; transform: rotateX(78deg); -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, black 10%, transparent 70%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, black 10%, transparent 70%); opacity:.55; }
  .logo3d{ position:relative; width:190px; height:190px; transform-style:preserve-3d; }
  @media (prefers-reduced-motion: no-preference){ .logo3d{ animation: spin 16s linear infinite; } }
  @keyframes spin{ from{ transform:rotateY(0deg); } to{ transform:rotateY(360deg); } }
  .mark{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .logo-glow{ position:absolute; width:320px; height:320px; background:radial-gradient(circle, var(--glow), transparent 65%); filter:blur(6px); pointer-events:none; }
  .orbit{ position:absolute; inset:0; transform-style:preserve-3d; }
  @media (prefers-reduced-motion: no-preference){ .orbit{ animation: spin var(--speed,22s) linear infinite; } .orbit.rev{ animation-direction:reverse; } }
  .sat{ position:absolute; top:50%; left:50%; width:50px; height:50px; margin:-25px; border-radius:50%; background:var(--bg); border:1px solid rgba(240,180,41,.5); display:flex; align-items:center; justify-content:center; font-size:19px; box-shadow:0 0 18px rgba(240,180,41,.25); transform: rotateY(calc(var(--ang) * 1deg)) translateZ(var(--r)); }
  .brand-block{ text-align:center; margin-top:22px; position:relative; z-index:2; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; direction:ltr; font-size:11px; letter-spacing:3px; color:var(--accent); margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .verified{ width:12px; height:12px; border-radius:50%; background:var(--accent); display:inline-block; position:relative; }
  .verified::after{ content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:var(--bg); font-weight:900; }
  .brand-title{ font-size:34px; font-weight:900; letter-spacing:-.5px; margin-bottom:10px; }
  .brand-tag{ font-size:14px; color:var(--text-dim); max-width:360px; margin:0 auto 30px auto; line-height:1.8; }
  .cta{ display:inline-block; background:var(--accent); color:#1A1300; font-weight:700; font-size:14px; padding:13px 30px; border-radius:12px; border:none; cursor:pointer; font-family:inherit; transition:.2s; }
  .cta:hover{ background:var(--accent-soft); box-shadow:0 0 24px rgba(240,180,41,.4); transform:translateY(-1px); }
  .hint{ margin-top:16px; font-size:11px; color:var(--text-dim); font-family:'IBM Plex Mono', monospace; direction:ltr; }

  /* ============ LOGIN ============ */
  #login-screen{ display:none; position:fixed; inset:0; z-index:40; background:var(--bg); align-items:center; justify-content:center; flex-direction:column; padding:30px; overflow-y:auto; }
  .login-box{ width:100%; max-width:520px; text-align:center; }
  .login-logo{ width:48px; height:48px; object-fit:contain; display:block; margin:0 auto 18px auto; }
  .login-title{ font-size:20px; font-weight:900; margin-bottom:6px; }
  .login-sub{ font-size:13px; color:var(--text-dim); margin-bottom:30px; }
  .emp-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; text-align:right; }
  .emp-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; display:flex; align-items:center; gap:10px; transition:.15s; }
  .emp-card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .emp-avatar{ width:36px; height:36px; border-radius:9px; background:var(--accent-dim); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; flex-shrink:0; }
  .emp-name{ font-size:13px; font-weight:700; }
  .emp-role{ font-size:11px; color:var(--text-dim); }
  .login-form{ text-align:right; }
  .login-err{ color:var(--danger); font-size:12px; margin:10px 0 0 0; display:none; text-align:center; }
  .api-config{ margin-top:22px; padding-top:18px; border-top:1px solid var(--border); text-align:center; }
  .api-config small{ color:var(--text-dim); font-size:11px; display:block; margin-bottom:8px; }
  .api-config input{ direction:ltr; text-align:left; }

  /* ============ DASHBOARD ============ */
  #dashboard-screen{ display:none; }
  .app{ display:flex; min-height:100vh; }
  .sidebar{ width:230px; background:var(--surface); border-left:1px solid var(--border); padding:28px 20px; flex-shrink:0; display:flex; flex-direction:column; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:2px; cursor:pointer; }
  .logo{ width:34px; height:34px; object-fit:contain; flex-shrink:0; display:block; }
  .brand-name{ font-weight:900; font-size:17px; letter-spacing:-0.3px; }
  .brand-sub{ font-size:12px; color:var(--text-dim); margin:6px 0 20px 0; }
  .user-chip{ display:flex; align-items:center; gap:9px; background:var(--surface-2); border-radius:10px; padding:9px 10px; margin-bottom:20px; }
  .user-chip .emp-avatar{ width:30px; height:30px; font-size:12px; }
  .user-chip-name{ font-size:12px; font-weight:700; }
  .user-chip-role{ font-size:10px; color:var(--text-dim); }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:10px; font-size:14px; font-weight:500; color:var(--text-dim); cursor:pointer; margin-bottom:4px; transition:.15s; }
  .nav-item:hover{ background:var(--surface-2); color:var(--text); }
  .nav-item.active{ background:var(--accent-dim); color:var(--accent); }
  .nav-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .sidebar-footer{ margin-top:auto; padding-top:16px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
  .demo-link, .logout-link{ font-size:11px; color:var(--text-dim); cursor:pointer; text-decoration:underline; }
  .demo-link:hover, .logout-link:hover{ color:var(--accent); }

  .main{ flex:1; padding:32px 40px; max-width:1180px; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; gap:16px; flex-wrap:wrap; }
  .page-title{ font-size:24px; font-weight:900; margin-bottom:4px; }
  .page-sub{ font-size:13px; color:var(--text-dim); }
  .btn{ background:var(--accent); color:#1A1300; border:none; padding:10px 18px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn.small{ padding:6px 12px; font-size:12px; }

  .toolbar{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .search-input{ flex:1; min-width:200px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; color:var(--text); font-family:inherit; font-size:13px; }
  .search-input:focus{ outline:none; border-color:var(--accent); }
  select.filter-select{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; color:var(--text); font-family:inherit; font-size:13px; }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
  .kpi{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
  .kpi-label{ font-size:12px; color:var(--text-dim); margin-bottom:8px; }
  .kpi-value{ font-size:26px; font-weight:900; }
  .kpi-value.mono{ font-size:24px; }
  .kpi-delta{ font-size:12px; margin-top:6px; font-weight:700; color:var(--text-dim); }

  .clients-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
  .client-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; cursor:pointer; transition:.15s; }
  .client-card:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .client-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .avatar{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; color:#1A1300; background:var(--accent); flex-shrink:0; }
  .client-name{ font-weight:700; font-size:15px; }
  .client-industry{ font-size:11px; color:var(--text-dim); }
  .badge{ font-size:10px; padding:3px 9px; border-radius:20px; font-weight:700; background:var(--surface-2); color:var(--text-dim); }
  .client-stats{ display:flex; gap:16px; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
  .cstat-v{ font-size:15px; font-weight:700; }
  .cstat-l{ font-size:10px; color:var(--text-dim); }

  .empty-state{ text-align:center; padding:70px 20px; background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius); }
  .empty-state .logo{ margin:0 auto 18px auto; width:48px; height:48px; }
  .empty-title{ font-weight:700; font-size:16px; margin-bottom:6px; }
  .empty-sub{ font-size:13px; color:var(--text-dim); margin-bottom:18px; }
  .empty-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  .back-link{ font-size:13px; color:var(--text-dim); cursor:pointer; margin-bottom:14px; display:inline-block; }
  .back-link:hover{ color:var(--accent); }
  .tabs{ display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:20px; }
  .tab{ padding:10px 4px; font-size:14px; font-weight:700; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent; margin-left:20px; }
  .tab.active{ color:var(--accent); border-color:var(--accent); }

  table{ width:100%; border-collapse:collapse; }
  .content-table{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .content-table th{ text-align:right; font-size:11px; color:var(--text-dim); font-weight:700; padding:12px 16px; background:var(--surface-2); white-space:nowrap; }
  .content-table td{ padding:13px 16px; font-size:13px; border-top:1px solid var(--border); }
  .content-table tr:hover td{ background:var(--surface-2); }
  .type-pill{ font-size:10px; padding:3px 9px; border-radius:6px; font-weight:700; }
  .type-pill.reel{ background:rgba(240,180,41,.15); color:var(--accent); }
  .type-pill.post{ background:rgba(140,150,144,.2); color:var(--text-dim); }
  .type-pill.story{ background:rgba(217,108,90,.15); color:var(--danger); }
  .row-actions{ display:flex; gap:8px; }
  .icon-btn{ background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:6px; padding:5px 9px; font-size:11px; cursor:pointer; font-family:inherit; }
  .icon-btn:hover{ color:var(--text); border-color:var(--text-dim); }
  .icon-btn.del:hover{ color:var(--danger); border-color:var(--danger); }

  .report-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .report-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
  .report-card h4{ font-size:13px; margin-bottom:12px; color:var(--text-dim); font-weight:700; }
  .rank-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--border); font-size:13px; }
  .rank-row:first-of-type{ border-top:none; }
  .rank-title{ font-weight:500; }
  .rank-value{ font-weight:700; }
  .best .rank-value{ color:var(--accent); }
  .worst .rank-value{ color:var(--danger); }

  .disclaimer{ margin-top:30px; padding:14px 18px; background:var(--surface-2); border:1px dashed var(--border); border-radius:12px; font-size:12px; color:var(--text-dim); }
  .disclaimer b{ color:var(--text); }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:10; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px; width:380px; max-height:88vh; overflow-y:auto; }
  .modal h3{ font-size:16px; margin-bottom:18px; }
  .field{ margin-bottom:14px; }
  .field label{ font-size:12px; color:var(--text-dim); display:block; margin-bottom:6px; }
  .field input, .field select{ width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:13px; }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--accent); }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions .btn{ flex:1; text-align:center; }
  .err{ color:var(--danger); font-size:12px; margin-top:4px; display:none; }

  /* Employee dashboard */
  .task-cols{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
  .task-col{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; min-height:120px; }
  .task-col h4{ font-size:12px; color:var(--text-dim); margin-bottom:12px; display:flex; justify-content:space-between; }
  .task-col h4 b{ color:var(--text); }
  .task-item{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; font-size:12px; }
  .task-item .t-title{ font-weight:700; margin-bottom:4px; }
  .task-item .t-meta{ color:var(--text-dim); font-size:11px; display:flex; justify-content:space-between; align-items:center; }
  .prio{ font-size:9px; padding:2px 7px; border-radius:20px; font-weight:700; }
  .prio.high{ background:rgba(217,108,90,.15); color:var(--danger); }
  .prio.mid{ background:rgba(240,180,41,.15); color:var(--accent); }
  .prio.low{ background:rgba(140,150,144,.2); color:var(--text-dim); }
  .done-check{ background:none; border:1px solid var(--ok); color:var(--ok); border-radius:6px; padding:3px 8px; font-size:10px; cursor:pointer; font-family:inherit; }
  .done-check:hover{ background:rgba(111,191,139,.15); }
  .task-empty{ font-size:11px; color:var(--text-dim); text-align:center; padding:14px 0; }

  .perm-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .perm-table th, .perm-table td{ border:1px solid var(--border); padding:9px 10px; text-align:center; }
  .perm-table th{ background:var(--surface-2); font-size:11px; color:var(--text-dim); }
  .perm-table td:first-child, .perm-table th:first-child{ text-align:right; font-weight:700; }
  .yes{ color:var(--ok); font-weight:900; }
  .no{ color:var(--text-dim); }

  /* Header bar: global search + notifications */
  .header-bar{ display:flex; justify-content:flex-end; gap:12px; align-items:center; padding:18px 40px 0 40px; position:relative; }
  .gsearch-wrap{ position:relative; width:280px; }
  .gsearch{ width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 14px; color:var(--text); font-family:inherit; font-size:13px; }
  .gsearch:focus{ outline:none; border-color:var(--accent); }
  .gsearch-results{ position:absolute; top:calc(100% + 6px); right:0; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; z-index:20; display:none; }
  .gsearch-results.show{ display:block; }
  .gs-item{ padding:9px 12px; font-size:12px; cursor:pointer; border-top:1px solid var(--border); }
  .gs-item:first-child{ border-top:none; }
  .gs-item:hover{ background:var(--surface-2); }
  .gs-item small{ color:var(--text-dim); display:block; font-size:10px; margin-top:2px; }
  .bell-wrap{ position:relative; }
  .bell-btn{ background:var(--surface); border:1px solid var(--border); border-radius:10px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; position:relative; }
  .bell-dot{ position:absolute; top:-4px; left:-4px; background:var(--danger); color:#fff; font-size:9px; font-weight:900; border-radius:20px; padding:1px 5px; }
  .notif-panel{ position:absolute; top:calc(100% + 8px); left:0; width:300px; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; z-index:20; display:none; }
  .notif-panel.show{ display:block; }
  .notif-item{ padding:11px 14px; font-size:12px; border-top:1px solid var(--border); }
  .notif-item:first-child{ border-top:none; }
  .notif-item.unread{ background:rgba(240,180,41,.06); }
  .notif-item small{ color:var(--text-dim); display:block; font-size:10px; margin-top:3px; }

  /* Board / list */
  .view-toggle{ display:flex; gap:6px; margin-bottom:16px; }
  .view-toggle button{ background:var(--surface); border:1px solid var(--border); color:var(--text-dim); padding:7px 14px; border-radius:8px; font-size:12px; cursor:pointer; font-family:inherit; }
  .view-toggle button.active{ background:var(--accent-dim); color:var(--accent); border-color:transparent; }
  .board-cols{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  .board-col{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; min-height:100px; }
  .board-col h4{ font-size:11px; color:var(--text-dim); margin-bottom:10px; }
  .board-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:9px; margin-bottom:8px; font-size:12px; }
  .board-card .t-title{ font-weight:700; margin-bottom:5px; }
  .board-card .t-meta{ color:var(--text-dim); font-size:10px; }
  .t-notes{ color:var(--text-dim); font-size:11px; margin-top:6px; padding-top:6px; border-top:1px dashed var(--border); }

  /* Calendar */
  .cal-group{ margin-bottom:16px; }
  .cal-date{ font-size:12px; font-weight:700; color:var(--accent); margin-bottom:8px; font-family:'IBM Plex Mono', monospace; direction:ltr; text-align:right; }
  .cal-row{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 14px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; font-size:13px; }
  .cal-row .cal-meta{ font-size:11px; color:var(--text-dim); }

  /* Brief */
  .brief-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .brief-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  .brief-card h5{ font-size:11px; color:var(--text-dim); margin-bottom:8px; }
  .brief-card p{ font-size:13px; line-height:1.7; white-space:pre-wrap; }

  @media print{
    body *{ visibility:hidden; }
    .print-report, .print-report *{ visibility:visible; }
    .print-report{ position:absolute; top:0; right:0; width:100%; padding:20px; color:#000; background:#fff; }
    .print-report .rank-value, .print-report .rank-title{ color:#000 !important; }
  }
</style>
</head>
<body>

<!-- ============ LANDING ============ -->
<div id="landing-screen">
  <div class="scene" id="scene">
    <div class="stage" id="stage">
      <div class="floor"></div>
      <div class="logo-glow"></div>
      <div class="orbit" style="--speed:24s;">
        <div class="sat" style="--ang:0; --r:180px;">▶</div>
        <div class="sat" style="--ang:90; --r:180px;">♡</div>
        <div class="sat" style="--ang:180; --r:180px;">↗</div>
        <div class="sat" style="--ang:270; --r:180px;">📣</div>
      </div>
      <div class="orbit rev" style="--speed:34s;">
        <div class="sat" style="--ang:45; --r:225px; width:32px; height:32px; margin:-16px; font-size:12px;">●</div>
        <div class="sat" style="--ang:225; --r:225px; width:32px; height:32px; margin:-16px; font-size:12px;">◆</div>
      </div>
      <div class="logo3d" id="logo3d"></div>
    </div>
    <div class="brand-block">
      <div class="eyebrow"><span class="verified"></span> najran_agency</div>

/* ============ REAL API CONNECTION ============ */
// الفرونت إند والباك إند صاروا يشتغلوا من نفس السيرفر (backend/server.js بيخدم هاد
// الملف مباشرة) — فمافي داعي لعنوان خارجي، مسار نسبي بس كافي وبيشتغل بأي بيئة.
const API_BASE = '/api';

let authToken = null; // بالذاكرة بس أثناء الجلسة — يعيد تسجيل الدخول لو انسكرت الصفحة

async function apiFetch(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (authToken) headers.Authorization = `Bearer ${authToken}`;
  const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) throw new Error(data?.error || `خطأ بالسيرفر (${res.status})`);
  return data;
}

/* ============ LOGIN / NAV FLOW (real email+password auth) ============ */
function showLogin(){
  document.getElementById('landing-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.body.style.overflow = 'auto';

  apiFetch('/auth/needs-setup').then(data => {
    if(data.needsSetup){
      document.getElementById('login-title').textContent = 'إعداد النظام لأول مرة';
      document.getElementById('login-sub').textContent = 'ما في حسابات بعد — أنشئ حساب المدير الأول';
      document.getElementById('login-form-normal').style.display = 'none';
      document.getElementById('login-form-setup').style.display = 'block';
    } else {
      document.getElementById('login-title').textContent = 'تسجيل الدخول';
      document.getElementById('login-sub').textContent = 'بريدك الإلكتروني وكلمة السر يلي أعطاك ياها المدير';
      document.getElementById('login-form-normal').style.display = 'block';
      document.getElementById('login-form-setup').style.display = 'none';
    }
  }).catch(() => {}); // لو السيرفر لسا ما اشتغل، يضل شكل تسجيل الدخول العادي
}

async function doFirstSetup(){
  const name = document.getElementById('setup-name').value.trim();
  const email = document.getElementById('setup-email').value.trim();
  const password = document.getElementById('setup-password').value;
  const errBox = document.getElementById('setup-err');
  errBox.style.display = 'none';
  if(!name || !email || !password || password.length < 6){
    errBox.textContent = 'كل الحقول مطلوبة، وكلمة السر 6 أحرف عالأقل';
    errBox.style.display = 'block';
    return;
  }
  try{
    await apiFetch('/auth/first-setup', { method:'POST', body: JSON.stringify({ name, email, password }) });
    document.getElementById('login-email').value = email;
    showLogin(); // بترجع تتحقق، وهلق needsSetup رح تصير false فبيرجع فورم الدخول العادي
  } catch(err){
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  }
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errBox = document.getElementById('login-err');
  errBox.style.display = 'none';
  if(!email || !password){ errBox.textContent = 'لازم بريد إلكتروني وكلمة سر'; errBox.style.display='block'; return; }

  try{
    const data = await apiFetch('/auth/login', { method:'POST', body: JSON.stringify({ email, password }) });
    authToken = data.token;
    currentUser = { id: data.user.id, name: data.user.name, role: data.user.role, permissions: data.user.permissions };
    enterDashboard();
  } catch(err){
    errBox.textContent = err.message || 'تعذر تسجيل الدخول — تأكد من صحة البريد وكلمة السر';
    errBox.style.display = 'block';
  }
}

function enterDashboard(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard-screen').style.display = 'block';

  document.getElementById('user-chip').innerHTML = `
    <div class="emp-avatar">${currentUser.name[0]}</div>
    <div><div class="user-chip-name">${currentUser.name}</div><div class="user-chip-role">${currentUser.role}</div></div>
  `;

  const nav = currentUser.permissions.map(k => [k, NAV_LABELS[k] || k]);
  document.getElementById('nav-items').innerHTML = nav.map((n,i) => `
    <div class="nav-item ${i===0?'active':''}" data-page="${n[0]}" onclick="go('${n[0]}')"><span class="nav-dot"></span> ${n[1]}</div>
  `).join('');

  document.getElementById('demo-link-slot').innerHTML = '';
  renderNotifPanel();
  go(nav[0][0]);
}

function logout(){
  currentUser = null;
  authToken = null;
  document.getElementById('dashboard-screen').style.display = 'none';
  showLogin();
}

function goHome(){
  if(!currentUser) return;
  go(currentUser.permissions[0]);
}

/* ============ NOTIFICATIONS ============ */
function renderNotifPanel(){
  const unread = notifications.filter(n => n.unread).length;
  document.getElementById('notif-count').style.display = unread ? 'inline-block' : 'none';
  document.getElementById('notif-count').textContent = unread;
  document.getElementById('notif-panel').innerHTML = notifications.map(n => `
    <div class="notif-item ${n.unread ? 'unread' : ''}">${n.text}<small>${n.time}</small></div>
  `).join('');
}
function toggleNotifs(){
  document.getElementById('notif-panel').classList.toggle('show');
  document.getElementById('gsearch-results').classList.remove('show');
}

/* ============ GLOBAL SEARCH ============ */
function onGlobalSearch(q){
  const box = document.getElementById('gsearch-results');
  document.getElementById('notif-panel').classList.remove('show');
  if(!q || q.trim().length < 1){ box.classList.remove('show'); box.innerHTML=''; return; }
  const ql = q.toLowerCase();
  let results = [];
  clients.forEach(c => { if(c.name.toLowerCase().includes(ql)) results.push({label:c.name, sub:'عميل · ' + (c.industry||''), action:`showClient(${c.id})`}); });
  if(currentUser && currentUser.permissions.includes('team')){
    employees.forEach(e => { if(e.name.toLowerCase().includes(ql)) results.push({label:e.name, sub:'موظف · ' + e.role_label, action:`go('team')`}); });
  }
  results = results.slice(0, 8);
  if(results.length === 0){ box.innerHTML = `<div class="gs-item">ما في نتائج</div>`; }
  else { box.innerHTML = results.map(r => `<div class="gs-item" onclick="${r.action}; closeSearch();">${r.label}<small>${r.sub}</small></div>`).join(''); }

}

async function loadTasks(assigneeId){
  const qs = assigneeId ? `?assignee=${assigneeId}` : '';
  return apiFetch(`/tasks${qs}`);
}

function toDatetimeLocal(isoString){
  const d = new Date(isoString);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function submitAddEmployee(){

  const email = document.getElementById('e-email').value.trim();

  const roleKey = document.getElementById('e-role').value;

let financeData = {};

}

function openFinanceModal(clientId){

    const statusLabel = {today:'قائمة اليوم', progress:'قيد التنفيذ', review:'بانتظار المراجعة', revision:'تعديلات مطلوبة', done:'مكتمل'};
    if(ts.length === 0) return `<div class="empty-state"><div class="empty-title">ما في مهام مرتبطة بهاد العميل</div></div>`;
    return `<table class="content-table"><thead><tr><th>المهمة</th><th>الموظف</th><th>الأولوية</th><th>الموعد</th><th>الحالة</th></tr></thead>
      <tbody>${ts.map(t => `<tr><td>${t.title}</td><td>${t.assignee}</td><td><span class="prio ${t.priority}">${prioLabel[t.priority]}</span></td><td class="mono" style="font-size:12px">${t.deadline}</td><td>${statusLabel[t.status]}</td></tr>`).join('')}</tbody></table>`;
  })();

  const calendarBody = (() => {
    let entries = c.content.map(item => ({date:item.date, label:`${typeLabel[item.type]}: ${item.title}`}));
    clientTasks(c).forEach(t => entries.push({date:t.deadline, label:`مهمة: ${t.title} (${t.assignee})`}));
    const groups = {};
    entries.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });
    const dates = Object.keys(groups);
    if(dates.length === 0) return `<div class="empty-state"><div class="empty-title">ما في مواعيد مسجلة بعد</div></div>`;
    return dates.map(d => `<div class="cal-group"><div class="cal-date">${d}</div>${groups[d].map(e => `<div class="cal-row"><span>${e.label}</span></div>`).join('')}</div>`).join('');
  })();

  const filesBody = `<div class="empty-state"><div class="empty-title">قريباً</div><div class="empty-sub">رفع ومشاركة ملفات التصميم والفيديو الخاصة بالعميل</div></div>`;

  const analyticsBody = c.content.length === 0 ? `<div class="empty-state"><div class="empty-title">ما في محتوى كفاية لبناء تحليل</div><div class="empty-sub">سجل شوية محتوى الأول من تبويب "المحتوى"</div></div>` : (() => {
    const sorted = [...c.content].sort((a,b) => b.views - a.views);
    const best = sorted.slice(0,3); const worst = sorted.slice(-3).reverse();
    return `<div class="report-grid">
      <div class="report-card"><h4>الأعلى مشاهدة</h4>${best.map(b => `<div class="rank-row best"><span class="rank-title">${b.title}</span><span class="rank-value mono">${b.views.toLocaleString()}</span></div>`).join('')}</div>
      <div class="report-card"><h4>الأقل مشاهدة</h4>${worst.map(w => `<div class="rank-row worst"><span class="rank-title">${w.title}</span><span class="rank-value mono">${w.views.toLocaleString()}</span></div>`).join('')}</div>
    </div>`;
  })();

  const reportsBody = `
    <div class="empty-state">
      <div class="empty-title">تقرير ${c.name} الشهري</div>
      <div class="empty-sub">لخّص أداء الشهر بضغطة وحدة، وصدّره PDF لإرساله للعميل</div>
      <button class="btn" onclick="openReportPreview()">توليد التقرير</button>
    </div>
  `;

  const bodies = {overview:overviewBody, brief:briefBody, content: c.content.length===0?contentEmpty:contentTable, tasks:tasksBody, calendar:calendarBody, files:filesBody, analytics:analyticsBody, reports:reportsBody};

  render(`
    <div class="back-link" onclick="showOverview()">‹ رجوع لكل العملاء</div>
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="avatar" style="width:52px; height:52px; font-size:20px;">${c.name[0]}</div>
        <div><div class="page-title">${c.name}</div><div class="page-sub">${c.industry}${c.instagram ? ' · ' + c.instagram : ''}</div></div>
      </div>
    </div>
    <div class="tabs">
      ${CLIENT_TABS.map(([k,label]) => `<div class="tab ${activeTab===k?'active':''}" onclick="setTab('${k}')">${label}</div>`).join('')}
    </div>
    ${bodies[activeTab]}
  `);
}

function openBriefModal(){
  const b = activeClient.brief || {};
  render(document.getElementById('main').innerHTML + `
    <div class="overlay" onclick="if(event.target===this) renderClient()">
      <div class="modal">
        <h3>تعديل بريف ${activeClient.name}</h3>
        <div class="field"><label>نبذة عن النشاط</label><input id="b-business" value="${b.business||''}"></div>
        <div class="field"><label>الجمهور المستهدف</label><input id="b-audience" value="${b.audience||''}"></div>
        <div class="field"><label>نبرة العلامة</label><input id="b-voice" value="${b.voice||''}"></div>
        <div class="field"><label>ملاحظات</label><input id="b-notes" value="${b.notes||''}"></div>
        <div class="modal-actions"><button class="btn ghost" onclick="renderClient()">إلغاء</button><button class="btn" onclick="saveBrief()">حفظ</button></div>
      </div>
    </div>
  `);
}
function saveBrief(){
  activeClient.brief = {
    business: document.getElementById('b-business').value.trim(),
    audience: document.getElementById('b-audience').value.trim(),
    voice: document.getElementById('b-voice').value.trim(),
    notes: document.getElementById('b-notes').value.trim(),
  };
  renderClient();
}

function openReportPreview(){
  const c = activeClient;
  const sorted = [...c.content].sort((a,b)=>b.views-a.views);
  render(document.getElementById('main').innerHTML + `
    <div class="overlay" onclick="if(event.target===this) renderClient()">
      <div class="modal" style="width:480px;">
        <div class="print-report">
          <h3>تقرير ${c.name} — آب 2026</h3>
          <p style="font-size:12px; color:var(--text-dim); margin:6px 0 16px 0;">Najran Agency · تقرير أداء شهري</p>
          <div class="report-card" style="margin-bottom:10px;"><h4>ملخص</h4>
            <div class="rank-row"><span class="rank-title">عدد المحتوى المنشور</span><span class="rank-value mono">${c.content.length}</span></div>
            <div class="rank-row"><span class="rank-title">إجمالي المشاهدات</span><span class="rank-value mono">${totalViews(c).toLocaleString()}</span></div>
          </div>
          ${sorted.length ? `<div class="report-card"><h4>الأعلى أداءً</h4>${sorted.slice(0,3).map(b=>`<div class="rank-row best"><span class="rank-title">${b.title}</span><span class="rank-value mono">${b.views.toLocaleString()}</span></div>`).join('')}</div>` : ''}
        </div>
        <div class="modal-actions" style="margin-top:18px;"><button class="btn ghost" onclick="renderClient()">إغلاق</button><button class="btn" onclick="window.print()">تصدير PDF</button></div>
      </div>
    </div>
  `);
}

function contentModalHTML(existing){
  const v = existing || {type:'reel', title:'', date:'', views:'', likes:'', comments:'', shares:''};
  return `
    <div class="overlay" onclick="if(event.target===this) renderClient()">
      <div class="modal">
        <h3>${existing ? 'تعديل محتوى' : 'تسجيل محتوى جديد'}</h3>
        <div class="field"><label>نوع المحتوى *</label><select id="f-type">
          <option value="reel" ${v.type==='reel'?'selected':''}>ريلز</option>
          <option value="post" ${v.type==='post'?'selected':''}>بوست</option>
          <option value="story" ${v.type==='story'?'selected':''}>ستوري</option>
        </select></div>
        <div class="field"><label>عنوان/وصف مختصر *</label><input id="f-title" value="${v.title}" placeholder="مثال: وصفة كبة نية"><div class="err" id="err-title">لازم تدخل عنوان</div></div>
        <div class="field"><label>التاريخ *</label><input id="f-date" value="${v.date}" placeholder="مثال: 15 آب"><div class="err" id="err-date">لازم تدخل التاريخ</div></div>
        <div class="field"><label>المشاهدات *</label><input id="f-views" type="number" value="${v.views}" placeholder="0"><div class="err" id="err-views">لازم تدخل رقم المشاهدات</div></div>
        <div class="field"><label>لايكات</label><input id="f-likes" type="number" value="${v.likes}" placeholder="0"></div>
        <div class="field"><label>تعليقات</label><input id="f-comments" type="number" value="${v.comments}" placeholder="0"></div>
        <div class="field"><label>مشاركات</label><input id="f-shares" type="number" value="${v.shares}" placeholder="0"></div>
        <div class="modal-actions"><button class="btn ghost" onclick="renderClient()">إلغاء</button><button class="btn" onclick="${existing ? `submitEditContent(${existing.id})` : 'submitAddContent()'}">حفظ</button></div>
      </div>
    </div>
  `;
}
function openAddContentModal(){ render(document.getElementById('main').innerHTML + contentModalHTML(null)); }
function openEditContentModal(contentId){ const item = activeClient.content.find(x => x.id === contentId); render(document.getElementById('main').innerHTML + contentModalHTML(item)); }

function readContentForm(){
  const type = document.getElementById('f-type').value;
  const title = document.getElementById('f-title').value.trim();
  const date = document.getElementById('f-date').value.trim();
  const views = document.getElementById('f-views').value;
  const likes = document.getElementById('f-likes').value || 0;
  const comments = document.getElementById('f-comments').value || 0;
  const shares = document.getElementById('f-shares').value || 0;
  let ok = true;
  if(!title){ document.getElementById('err-title').style.display='block'; ok=false; } else { document.getElementById('err-title').style.display='none'; }
  if(!date){ document.getElementById('err-date').style.display='block'; ok=false; } else { document.getElementById('err-date').style.display='none'; }
  if(!views){ document.getElementById('err-views').style.display='block'; ok=false; } else { document.getElementById('err-views').style.display='none'; }
  if(!ok) return null;
  return { type, title, date, views: parseInt(views), likes: parseInt(likes), comments: parseInt(comments), shares: parseInt(shares) };
}
function submitAddContent(){ const data = readContentForm(); if(!data) return; data.id = nextContentId++; activeClient.content.push(data); renderClient(); }
function submitEditContent(contentId){ const data = readContentForm(); if(!data) return; const idx = activeClient.content.findIndex(x => x.id === contentId); activeClient.content[idx] = { ...data, id: contentId }; renderClient(); }
function deleteContent(contentId){ if(!confirm('متأكد بدك تحذف هالمحتوى؟')) return; activeClient.content = activeClient.content.filter(x => x.id !== contentId); renderClient(); }

function showAgencyReport(){
  if(clients.length === 0){
    render(`<div class="topbar"><div><div class="page-title">التقارير الشهرية</div><div class="page-sub">تقرير شامل لكل عملاء الوكالة</div></div></div><div class="empty-state"><div class="empty-title">ما في عملاء بعد</div><div class="empty-sub">ضيف عملاء وسجل محتواهم حتى يظهر هون تقرير مقارن</div></div>`);
    return;
  }
  const ranked = clients.map(c => ({
    name: c.name, industry: c.industry, views: totalViews(c), count: c.content.length,
    engagement: c.content.length ? (c.content.reduce((s,i)=>s+i.likes+i.comments+i.shares,0) / Math.max(totalViews(c),1) * 100) : 0
  })).sort((a,b) => b.views - a.views);
  const bestClient = ranked[0];
  const worstClient = [...ranked].filter(r => r.count > 0).sort((a,b) => a.views - b.views)[0];

  render(`
    <div class="topbar"><div><div class="page-title">التقارير الشهرية</div><div class="page-sub">مقارنة أداء كل العملاء — آب 2026</div></div></div>
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">أفضل عميل بالمشاهدات</div><div class="kpi-value" style="font-size:16px">${bestClient ? bestClient.name : '—'}</div><div class="kpi-delta">${bestClient ? bestClient.views.toLocaleString() + ' مشاهدة' : ''}</div></div>
      <div class="kpi"><div class="kpi-label">أقل عميل بالمشاهدات</div><div class="kpi-value" style="font-size:16px">${worstClient ? worstClient.name : '—'}</div><div class="kpi-delta">${worstClient ? worstClient.views.toLocaleString() + ' مشاهدة' : ''}</div></div>
      <div class="kpi"><div class="kpi-label">إجمالي المشاهدات</div><div class="kpi-value mono">${ranked.reduce((s,r)=>s+r.views,0).toLocaleString()}</div><div class="kpi-delta">عبر كل العملاء</div></div>
      <div class="kpi"><div class="kpi-label">إجمالي المحتوى</div><div class="kpi-value mono">${ranked.reduce((s,r)=>s+r.count,0)}</div><div class="kpi-delta">هالشهر</div></div>
    </div>
    <table class="content-table">
      <thead><tr><th>العميل</th><th>المجال</th><th>عدد المحتوى</th><th>إجمالي المشاهدات</th><th>معدل التفاعل</th></tr></thead>
      <tbody>${ranked.map((r,i) => `<tr><td>${i===0 && r.count>0 ? '⭐ ' : ''}${r.name}</td><td>${r.industry}</td><td class="mono">${r.count}</td><td class="mono">${r.views.toLocaleString()}</td><td class="mono">${r.count ? r.engagement.toFixed(1) + '%' : '—'}</td></tr>`).join('')}</tbody>
    </table>
    <div class="disclaimer"><b>ملاحظة:</b> معدل التفاعل = (لايكات + تعليقات + مشاركات) ÷ المشاهدات. مقياس تقريبي لحد ما يصير الربط الحقيقي مع Meta API.</div>
  `);
}

</script>
</body>
</html>
